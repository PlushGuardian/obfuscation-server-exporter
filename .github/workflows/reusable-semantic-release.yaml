name: Run Semantic Release

on:
  workflow_call:
    inputs:
      dry_run:
        description: 'Run in dry‑run mode (no release published)'
        type: boolean
        default: false
      image:
        description: 'Docker image containing semantic-release'
        type: string
        default: 'docker.io/plushguardian/semantic-release-for-ci:1.0.1'
    secrets:
      gh_token:
        required: true
    outputs:
      new_version:
        description: 'The newly created version tag (e.g., v1.2.3)'
        value: ${{ jobs.run-semantic-release.outputs.new_version }}
      release_published:
        description: 'Whether a new release was published in this run'
        value: ${{ jobs.run-semantic-release.outputs.release_published }}
      release_notes:
        description: 'Release notes (only populated in dry‑run mode)'
        value: ${{ jobs.run-semantic-release.outputs.release_notes }}

jobs:
  run-semantic-release:
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.image }}
    outputs:
      new_version: ${{ steps.get_version.outputs.new_version }}
      release_published: ${{ steps.get_release_status.outputs.release_published }}
      release_notes: ${{ steps.get_release_notes.outputs.release_notes }}
    steps:
      - name: Checkout code (full history)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Mark workspace as Git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # ── Run semantic‑release  ──────────────────────
      - name: Run semantic-release
        id: run_release
        env:
          GITHUB_TOKEN: ${{ secrets.gh_token }}
        run: |
          set +e
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            npx semantic-release --no-ci --dry-run \
              --plugins @semantic-release/commit-analyzer,@semantic-release/release-notes-generator \
              --branches ${{ github.head_ref }} 2>&1 | tee semrel-output.txt
          else
            npx semantic-release 2>&1 | tee semrel-output.txt
          fi
          exit_code=${PIPESTATUS[0]}
          set -e
          echo "exit_code=${exit_code}" >> $GITHUB_OUTPUT

      # ── Parse output ────────────────────────────────
      - name: Extract new version tag
        id: get_version
        run: |
          if [ "${{ inputs.dry_run }}" = "false" ]; then
            git fetch --tags
            new_version=$(git describe --tags --abbrev=0)
          else
            new_version=$(sed -n 's/.*Release note for version \([^[:space:]]*\).*/\1/p' semrel-output.txt)
          fi
          echo "new_version: $new_version"
          echo "new_version=$new_version" >> $GITHUB_OUTPUT

      - name: Extract release published
        id: get_release_status
        run: |
          if [ "${{ steps.run_release.outputs.exit_code }}" -eq 0 ]; then
            release_published=true
          else
            release_published=false
          fi
          echo "release_published: $release_published"
          echo "release_published=$release_published" >> $GITHUB_OUTPUT

      - name: Extract release notes
        if: inputs.dry_run == true
        id: get_release_notes
        run: |
          output=$(cat semrel-output.txt)
          notes=$(awk '/Release note for version/{flag=1; next} flag' semrel-output.txt)
          echo "release_notes: $notes"
          echo "$notes" > release-notes.md
          echo "release_notes<<EOF" >> $GITHUB_OUTPUT
          cat release-notes.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
