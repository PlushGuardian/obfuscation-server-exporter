name: Run Semantic Release

on:
  workflow_call:
    inputs:
      dry_run:
        description: 'Run in dry‑run mode (no release published)'
        type: boolean
        default: false
      image:
        description: 'Docker image containing semantic-release'
        type: string
        default: 'docker.io/plushguardian/semantic-release-for-ci:1.0.1'
    secrets:
      gh_token:
        required: true
    outputs:
      new_version:
        description: 'The newly created version tag (e.g., v1.2.3)'
        value: ${{ jobs.run-semantic-release.outputs.new_version }}
      release_published:
        description: 'Whether a new release was published in this run'
        value: ${{ jobs.run-semantic-release.outputs.release_published }}
      release_notes:
        description: 'Release notes (only populated in dry‑run mode)'
        value: ${{ jobs.run-semantic-release.outputs.release_notes }}

jobs:
  run-semantic-release:
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.image }}
    outputs:
      new_version: ${{ steps.get_version.outputs.new_version }}
      release_published: ${{ steps.get_release_status.outputs.release_published }}
      release_notes: ${{ steps.get_release_notes.outputs.release_notes }}
    steps:
      - name: Checkout code (full history)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Mark workspace as Git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # ── Run semantic‑release (dry‑run or real) ──────
      - name: Run semantic-release
        id: run_release
        env:
          GITHUB_TOKEN: ${{ secrets.gh_token }}
        run: |
          set +e
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            # git fetch origin main --depth=50
            # git checkout -B main origin/main
            # git merge ${{ github.event.pull_request.head.sha }} --no-edit
            # # Remove CI detection so semantic-release doesn't bail
            unset GITHUB_ACTIONS
            unset GITHUB_EVENT_NAME
            output="$(sh -c "npx semantic-release --dry-run --no-ci --branches '${ github.head_ref }'")"
          else
            output=$(npx semantic-release 2>&1)
          fi
          exit_code=$?
          set -e
          echo "exit_code=${exit_code}" >> $GITHUB_OUTPUT
          echo "$output" > semrel-output.txt

      # ── Parse output ────────────────────────────────
      - name: Extract new version tag
        id: get_version
        run: |
          if [ "${{ inputs.dry_run }}" = "false" ]; then
            git fetch --tags
            echo "new_version=$(git describe --tags --abbrev=0)" >> $GITHUB_OUTPUT
          else
            echo "new_version=$(sed -n 's/.*The next release version is \([^[:space:]]*\).*/\1/p' semrel-output.txt)" >> $GITHUB_OUTPUT
          fi

      - name: Extract release published
        id: get_release_status
        run: |
          if [ "${{ steps.run_release.outputs.exit_code }}" -eq 0 ]; then
            echo "release_published=true" >> $GITHUB_OUTPUT
          else
            echo "release_published=false" >> $GITHUB_OUTPUT
          fi

      - name: Extract release notes
        if: inputs.dry_run == true
        id: get_release_notes
        run: |
          output=$(cat semrel-output.txt)
          notes=$(awk '/The next release version is/{flag=1; next} flag' semrel-output.txt)
          echo "$notes" > release-notes.md
          echo "release_notes<<EOF" >> $GITHUB_OUTPUT
          cat release-notes.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Debug all outputs
        run: |
          
          echo "dry_run: ${{ inputs.dry_run }}"
          echo "new_version: ${{ steps.get_version.outputs.new_version }}"
          echo "release_published: ${{ steps.get_release_status.outputs.release_published }}"
          echo "release_notes: ${{ steps.get_release_notes.outputs.release_notes }}"
          cat semrel-output.txt
