name: Run Semantic Release

on:
  workflow_call:
    inputs:
      dry_run:
        description: 'Run in dry‑run mode (no release published)'
        type: boolean
        default: false
      image:
        description: 'Docker image containing semantic-release'
        type: string
        default: 'docker.io/plushguardian/semantic-release-for-ci:1.0.1'
    secrets:
      gh_token:
        required: true
    outputs:
      new_version:
        description: 'The newly created version tag (e.g., v1.2.3)'
        value: ${{ jobs.run-semantic-release.outputs.new_version }}
      release_published:
        description: 'Whether a new release was published in this run'
        value: ${{ jobs.run-semantic-release.outputs.release_published }}
      release_notes:
        description: 'Release notes (only populated in dry‑run mode)'
        value: ${{ jobs.run-semantic-release.outputs.release_notes }}

jobs:
  run-semantic-release:
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.image }}
    outputs:
      new_version: ${{ steps.get_version.outputs.version }}
    steps:
      - name: Checkout code (full history)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Mark workspace as Git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # ── Run semantic‑release (dry‑run or real) ──────
      - name: Run semantic-release
        id: run_release
        env:
          GITHUB_TOKEN: ${{ secrets.gh_token }}
        run: |
          set +e
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            output=$(npx semantic-release --dry-run 2>&1)
          else
            output=$(npx semantic-release 2>&1)
          fi
          exit_code=$?
          set -e
          echo "exit_code=${exit_code}" >> $GITHUB_OUTPUT
          echo "$output" > semrel-output.txt

      # ── Parse output ────────────────────────────────
      - name: Extract new version tag
        id: get_version
        run: |
          if [ "${{ inputs.dry_run }}" = "false" ]; then
            git fetch --tags
            echo "new_version=$(git describe --tags --abbrev=0)" >> $GITHUB_OUTPUT
          else
            new_version=$(cat semrel-output.txt | grep -oP 'The next release version is \K\S+' || echo '')
          fi

      - name: Extract release published
        id: get_version
        run: |
          if [ "${{ steps.run_release.outputs.exit_code }}" -eq 0 ]; then
            echo "release_published=true" >> $GITHUB_OUTPUT
          else
            echo "release_published=false" >> $GITHUB_OUTPUT
          fi

      - name: Extract release notes
        if: inputs.dry_run == 'true'
        id: parse
        run: |
          output=$(cat semrel-output.txt)
          notes=$(echo "$output" | sed -n '/^#/,$p' || true)
          echo "$notes" > release-notes.md
          echo "release_notes<<EOF" >> $GITHUB_OUTPUT
          cat release-notes.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
