name: Run Semantic Release

on:
  workflow_call:
    inputs:
      image:
        description: 'Docker image containing semantic-release'
        type: string
        default: 'docker.io/plushguardian/semantic-release-for-ci:1.0.1'
    secrets:
      gh_token:
        required: true
    outputs:
      new_version:
        description: 'The newly created version tag (e.g., v1.2.3)'
        value: ${{ jobs.release.outputs.new_version }}
      release_published:
        description: 'Whether a new release was published in this run'
        value: ${{ jobs.release.outputs.release_published }}

jobs:
  run-semantic-release:
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.image }}
    outputs:
      new_version: ${{ steps.get_version.outputs.version }}
    steps:
      - name: Checkout code (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mark workspace as Git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.gh_token }}
        run: npx semantic-release

      - name: Extract new version tag
        id: get_version
        run: echo "version=$(git describe --tags --abbrev=0)" >> $GITHUB_OUTPUT

  check-new-release:
    needs: run-semantic-release
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ needs.run-semantic-release.outputs.new_version }}
      release_published: ${{ steps.set_flag.outputs.release_published }}
    steps:
      - name: Determine if a release was published
        id: set_flag
        run: |
          if [ -n "${{ needs.run-semantic-release.outputs.new_version }}" ]; then
            echo "release_published=true" >> $GITHUB_OUTPUT
            echo "✅ A new release was published: ${{ needs.run-semantic-release.outputs.new_version }}"
          else
            echo "release_published=false" >> $GITHUB_OUTPUT
            echo "⏭️ No new release – skipping downstream jobs"
          fi
