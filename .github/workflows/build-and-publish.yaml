name: Build, push Docker image & attach binary on release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # --- Extract release tag ---
      - name: Get release tag
        id: get_tag
        run: echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      # --- Set up Go (for compilation) ---
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.7'
          check-latest: true

      # --- Compile a static Linux binary ---
      - name: Build Go binary
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: amd64
        run: |
          go build \
            -ldflags="-w -s -X main.version=${{ steps.get_tag.outputs.TAG }} -X main.commit=${{ github.sha }}" \
            -trimpath \
            -o obfs-exporter .

      # --- Archive the binary ---
      - name: Create archive
        run: tar -czf obfs-exporter-linux-amd64.tar.gz obfs-exporter

      # --- Upload to existing GitHub Release ---
      - name: Upload binary to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_tag.outputs.TAG }}
          files: obfs-exporter-linux-amd64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GH_RELEASE_PAT }}

      # --- Docker Hub login & push (unchanged) ---
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.DOCKERHUB_USERNAME }}/obfs-exporter
          tags: |
            type=semver,pattern={{version}},value=${{ steps.get_tag.outputs.TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.get_tag.outputs.TAG }}
            type=semver,pattern={{major}},value=${{ steps.get_tag.outputs.TAG }}
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_TAG=${{ steps.get_tag.outputs.TAG }}
            GIT_COMMIT=${{ github.sha }}
