name: Pull request

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  golangci-lint:
    uses: ./.github/workflows/reusable-golangci-lint.yaml

  preview-semantic-release:
    uses: ./.github/workflows/reusable-semantic-release.yaml
    with:
      dry_run: true
    secrets:
      gh_token: ${{ secrets.GH_RELEASE_PAT }}

  build-body:
    needs: preview-semantic-release
    runs-on: ubuntu-latest
    outputs:
      comment_body: ${{ steps.build.outputs.body }}
    steps:
      - name: Build comment body
        id: build
        run: |
          if [ "${{ needs.preview-semantic-release.outputs.release_published }}" = "true" ]; then
            content="## 🚀 Release Preview\n\n**Next version:** \`${{ needs.preview-semantic-release.outputs.new_version }}\`\n\n<details><summary>📝 Release notes</summary>\n\n${{ needs.preview-semantic-release.outputs.release_notes }}\n</details>"
          else
            content="## ⏭️ No release\n\nNo version bump will be triggered."
          fi
          echo "body<<EOF" >> $GITHUB_OUTPUT
          echo "$content" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

  comment:
    needs: build-body
    if: always()
    uses: ./.github/workflows/reusable-comment-on-pr.yml
    with:
      body: ${{ needs.build-body.outputs.comment_body }}
      pr_number: ${{ github.event.pull_request.number }}
      marker: '<!-- SEMANTIC-RELEASE-PREVIEW -->'
    secrets:
      github_token: ${{ secrets.GITHUB_TOKEN }}



